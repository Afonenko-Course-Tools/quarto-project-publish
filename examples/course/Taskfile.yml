version: '3'
tasks:
  install:
    cmds:
      - quarto add Afonenko-Course-Tools/quarto-project-publish@v5.0.0 --no-prompt
      - quarto add Afonenko-Course-Tools/quarto-reference-catalog@v3.0.0 --no-prompt
      - task: install:book
      - task: install:materials
  render:
    cmds:
      - quarto render
      - quarto run build-info.ts
  install:book:
    internal: true
    dir: book
    cmds:
      - quarto add Afonenko-Course-Tools/quarto-reference-catalog@v3.0.0 --no-prompt
  install:materials:
    internal: true
    dir: materials
    cmds:
      - quarto add Afonenko-Course-Tools/quarto-reference-catalog@v3.0.0 --no-prompt
