title: Reference Catalog
author: Anatoly Afonenko
version: 1.0.0
quarto-required: ">=1.10.0"
contributes:
  filters:
    - at: pre-ast
      path: lua/requests.lua
    - at: post-ast
      path: lua/probes.lua
  shortcodes:
    - lua/shortcodes.lua
  metadata:
    project:
      resources:
        - "!book/**"
        - "!lectures/**"
        - "!practice/**"
      pre-render: entrypoints/pre.ts
      post-render: entrypoints/post.ts
      preview:
        watch-inputs: false
        serve:
          cmd: "quarto run ../.qrc/preview.ts --port {port} --host {host}"
          ready: "QRC preview ready"
