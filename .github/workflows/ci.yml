name: Проверка course-site 6.0.0
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    env:
      XDG_CACHE_HOME: ${{ runner.temp }}/course-site-cache
      PERFORMANCE: ${{ github.workspace }}/quarto-course-performance
      COURSE_PERFORMANCE_SOURCE: ${{ github.workspace }}/quarto-course-performance
      LUA_LANGUAGE_SERVER: ${{ runner.temp }}/luals/bin/lua-language-server
    strategy:
      fail-fast: false
      matrix:
        quarto: [1.11.5]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: quarto-project-publish
          persist-credentials: false
      - name: Подготовить доступный кеш Quarto
        run: |
          mkdir -p -- "$XDG_CACHE_HOME"
          test -w "$XDG_CACHE_HOME"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: Afonenko-Course-Tools/quarto-course
          ref: c950a962a76a26dc61378fdc16bb80533800596e # Core 9.3.4: согласованный provider текущей Java/SP композиции
          path: quarto-course
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: Afonenko-Course-Tools/quarto-reference-catalog
          ref: 541a44836cf5ec934a101059cbee77c9ff47d134 # QRC 3.2.0: согласованный provider текущей Java/SP композиции
          path: quarto-reference-catalog
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: Afonenko-Course-Tools/quarto-project-download
          ref: 9e9a55c483d2b547f047a64fdebc5a5b3f379380 # Download 3.5.0: публичные resetDownloadRequests/prepareNativeDownloads
          path: quarto-project-download
          persist-credentials: false
      - name: Проверить закреплённые Core и QRC
        run: |
          test "$(git -C quarto-course rev-parse HEAD)" = "c950a962a76a26dc61378fdc16bb80533800596e"
          test "$(git -C quarto-reference-catalog rev-parse HEAD)" = "541a44836cf5ec934a101059cbee77c9ff47d134"
      - name: Проверить закреплённый Download
        run: |
          git -C quarto-project-download rev-parse HEAD
          test "$(git -C quarto-project-download rev-parse HEAD)" = "9e9a55c483d2b547f047a64fdebc5a5b3f379380"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: Afonenko-Course-Tools/quarto-course-prairielearn
          ref: c4a474fa443f6ac7e688c5c2805db0a74b9afbd0 # PL 9.0.7: согласованный публичный inspectPublication; не запуск C CLI
          path: quarto-course-prairielearn
          persist-credentials: false
      - name: Проверить закреплённый public validator
        run: test "$(git -C quarto-course-prairielearn rev-parse HEAD)" = "c4a474fa443f6ac7e688c5c2805db0a74b9afbd0"
      - uses: quarto-dev/quarto-actions/setup@8a96df13519ee81fd526f2dfca5962811136661b
        with:
          version: ${{ matrix.quarto }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: Afonenko-Course-Tools/quarto-course-performance
          ref: 0781f03a11f461691d7ce116f2c53bb5d8af68d7
          path: quarto-course-performance
          persist-credentials: false
      - name: Проверить закреплённый Performance и установить LuaLS
        run: |
          test "$(git -C "$PERFORMANCE" rev-parse HEAD)" = "0781f03a11f461691d7ce116f2c53bb5d8af68d7"
          bash "$PERFORMANCE/tools/setup-lua-ci.sh" "$RUNNER_TEMP/luals"
      - name: Установить закреплённый ShellCheck
        run: |
          tool_dir="$RUNNER_TEMP/shellcheck-0.11.0"
          mkdir -- "$tool_dir"
          curl --fail --location --silent --show-error \
            https://github.com/koalaman/shellcheck/releases/download/v0.11.0/shellcheck-v0.11.0.linux.x86_64.tar.xz \
            --output "$tool_dir/archive.tar.xz"
          printf '%s  %s\n' 8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198 "$tool_dir/archive.tar.xz" | sha256sum --check --status
          tar -xJf "$tool_dir/archive.tar.xz" --directory "$tool_dir" --strip-components=1
          "$tool_dir/shellcheck" --version
          printf '%s\n' "$tool_dir" >> "$GITHUB_PATH"
      - name: Строгая проверка собственного Lua
        working-directory: quarto-project-publish
        run: quarto run tools/check-types.ts --lua
      - name: ShellCheck и синтаксис каждого собственного shell-файла
        working-directory: quarto-project-publish
        run: |
          shellcheck --severity=style \
            tests/fixtures/command-probe.sh \
            tests/fixtures/functional-env.sh \
            tests/fixtures/live-tool.sh \
            tests/fixtures/native-failure.sh \
            tests/fixtures/performance-tool.sh
          for script in \
            tests/fixtures/command-probe.sh \
            tests/fixtures/functional-env.sh \
            tests/fixtures/live-tool.sh \
            tests/fixtures/native-failure.sh \
            tests/fixtures/performance-tool.sh; do
            bash -n "$script"
          done
      - name: Восстанавливаемая Markdown-копия и защищённые исходники
        working-directory: quarto-project-publish
        run: timeout --signal=TERM --kill-after=5s 60s quarto run tests/release-resources.ts
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '26.10.0'
          package-manager-cache: false
      - name: Строгая типизация полного собственного состава
        working-directory: quarto-project-publish
        env:
          CORE: ${{ github.workspace }}/quarto-course
          PL: ${{ github.workspace }}/quarto-course-prairielearn
          DOWNLOAD: ${{ github.workspace }}/quarto-project-download
          QRC: ${{ github.workspace }}/quarto-reference-catalog
        run: |
          npm ci --ignore-scripts
          npm run check:types
      - name: Зависимости браузерной проверки
        working-directory: quarto-project-publish
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/course-site-browsers
        run: |
          npx playwright install --with-deps chromium
      - name: Проверка навигации в браузере
        working-directory: quarto-project-publish
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/course-site-browsers
        run: npm run test:browser
      - name: HTML-дерево и автономная поставка навигации
        working-directory: quarto-project-publish
        run: |
          quarto run tests/site-navigation-html.ts
          quarto run tests/site-navigation-installed.ts
      - name: Проверка режима off без доступа к часам
        working-directory: quarto-project-publish
        run: quarto run tests/performance.ts
      - name: Установленная native композиция и домены
        working-directory: quarto-project-publish
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/course-site-browsers
          CORE: ${{ github.workspace }}/quarto-course
          QRC: ${{ github.workspace }}/quarto-reference-catalog
          DOWNLOAD: ${{ github.workspace }}/quarto-project-download
          PL: ${{ github.workspace }}/quarto-course-prairielearn
          COURSE_CORE_PROVIDER: ${{ github.workspace }}/quarto-course
          QRC_PROVIDER: ${{ github.workspace }}/quarto-reference-catalog
          COURSE_SITE_TEST_ROOT: ${{ runner.temp }}/course-site-native
          COURSE_SITE_DOMAIN_ROOT: ${{ runner.temp }}/course-site-domains
          COURSE_SITE_PROJECT_ROOT: ${{ runner.temp }}/course-site-project
        run: |
          quarto run tests/performance-context.ts
          quarto run tests/performance-noenv.ts
          quarto run tests/planning-progress.ts
          quarto run tests/site-inspect-version.ts
          quarto run tests/site-native-planning.ts
          quarto run tests/site-native-pipeline.ts
          for mode in missing unexpected root-missing; do
            quarto run tests/site-native-pipeline.ts "$mode"
          done
          quarto run tests/site-composed-navigation.ts --web-only
          quarto run tests/site-public-operation.ts
          B2_ROOT_NATIVE=1 quarto run tests/site-public-operation.ts
          B2_ROOT_NATIVE=1 B2_DEFAULT_CORE=1 quarto run tests/site-public-operation.ts
          for mode in positive full author-starter conditions document-course assessment pl pl-missing root-pl default revealjs reveal-model inactive-course mixed-default; do
            quarto run tests/site-owner-release.ts "$mode"
          done
          quarto run tests/release-composition.ts
          quarto run tests/site-project-native.ts
          quarto run tests/type-boundaries.ts
          quarto run tests/collection-id-boundary.ts
          quarto run tests/site-paths.ts
          quarto run tests/site-profiles.ts
          quarto run tests/site-child-profiles.ts default
          quarto run tests/site-child-profiles.ts group
          quarto run tests/site-metadata-profiles.ts
          quarto run tests/site-source-paths.ts
          quarto run tests/site-collection.ts
          quarto run tests/site-effective-formats.ts
          quarto run tests/site-web-selection.ts
          quarto run tests/process-live-output.ts
          quarto run tests/site-process.ts
          quarto run tests/site-siblings.ts
          quarto run tests/site-native.ts warnings
          quarto run tests/site-native.ts
          COURSE_SITE_DOMAIN_ROOT="${COURSE_SITE_DOMAIN_ROOT}-all" quarto run tests/site-domains.ts
          COURSE_SITE_DOMAIN_ROOT="${COURSE_SITE_DOMAIN_ROOT}-resources" quarto run tests/site-domains.ts resources
          COURSE_SITE_DOMAIN_ROOT="${COURSE_SITE_DOMAIN_ROOT}-rootless" quarto run tests/site-domains.ts rootless
          quarto run tests/site-formats.ts
          quarto run tests/site-local.ts
          quarto run tests/site-preview.ts "$COURSE_SITE_TEST_ROOT"
          COURSE_SITE_DOMAIN_ROOT="${COURSE_SITE_DOMAIN_ROOT}-smoke" quarto run tests/site-domains.ts smoke
          quarto run tests/site-preview.ts "${COURSE_SITE_DOMAIN_ROOT}-smoke" --course
      - name: Диагностика
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: course-site-${{ matrix.quarto }}
          path: |
            ${{ runner.temp }}/course-site-native/logs
            ${{ runner.temp }}/course-site-native/trace.jsonl
            ${{ runner.temp }}/course-site-domains-all/_generated/test-logs
            ${{ runner.temp }}/course-site-domains-resources/_generated/test-logs
            ${{ runner.temp }}/course-site-domains-rootless/_generated/test-logs
            ${{ runner.temp }}/course-site-domains-smoke/_generated/test-logs
            ${{ runner.temp }}/course-site-project/_generated/test-logs
          if-no-files-found: ignore
